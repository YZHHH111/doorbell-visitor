<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客登记</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-visitor">
    <div class="container visitor-container">
        <div class="card">
            <h1>📋 访客登记</h1>
            <p class="subtitle">请填写您的信息</p>
            <form id="visitorForm">
                <div class="form-group">
                    <label for="name">姓名 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                </div>
                <div class="form-group">
                    <label for="reason">来访事由</label>
                    <input type="text" id="reason" name="reason" placeholder="如：拜访朋友、送快递">
                </div>
                <div class="form-group">
                    <label for="phone">电话</label>
                    <input type="tel" id="phone" name="phone" placeholder="选填，方便联系">
                </div>
                <div class="form-group">
                    <label>拍照（选填）</label>
                    <div class="photo-upload" id="photoBox" onclick="document.getElementById('photoInput').click()">
                        <input type="file" id="photoInput" name="photo" accept="image/*" capture="environment" style="display:none">
                        <div class="photo-placeholder" id="photoPlaceholder">
                            <span class="camera-icon">📷</span>
                            <span class="photo-text">点击拍照或选择照片</span>
                        </div>
                        <img id="photoPreview" class="photo-preview-hidden">
                    </div>
                </div>
                <button type="submit" class="btn-submit">提交登记</button>
            </form>
            <div id="result" class="result-hidden"></div>
        </div>
    </div>
    <script>
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('photoPreview').src = ev.target.result;
                    document.getElementById('photoPreview').className = 'photo-preview-visible';
                    document.getElementById('photoPlaceholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });
        document.getElementById('visitorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.btn-submit');
            const result = document.getElementById('result');
            btn.disabled = true;
            btn.textContent = '提交中...';
            try {
                const resp = await fetch('/api/visitor/submit', {
                    method: 'POST',
                    body: new FormData(form)
                });
                const data = await resp.json();
                result.className = 'result-success';
                result.textContent = data.message || '登记成功！';
                form.reset();
                document.getElementById('photoPreview').className = 'photo-preview-hidden';
                document.getElementById('photoPlaceholder').style.display = '';
            } catch (err) {
                result.className = 'result-error';
                result.textContent = '提交失败，请重试';
            }
            btn.disabled = false;
            btn.textContent = '提交登记';
        });
    </script>
</body>
</html>
