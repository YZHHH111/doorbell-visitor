<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-admin">
    <div class="container dashboard-container">
        <div class="header-row">
            <h1>📊 访客管理</h1>
            <div class="header-actions">
                <span class="badge" id="totalBadge">共 0 条</span>
                <span class="badge today" id="todayBadge">今日 0 条</span>
                <a href="/qrcode" class="btn-link">📱 二维码</a>
                <a href="/admin/camera" class="btn-link">📷 摄像头</a>
                <a href="/admin/logout" class="btn-link logout">退出</a>
            </div>
        </div>

        <div class="sensor-card" id="sensorCard" style="display:none">
            <div class="sensor-item">
                <span class="sensor-icon">🌡</span>
                <span class="sensor-label">温度</span>
                <span class="sensor-value" id="sensorTemp">--</span>
            </div>
            <div class="sensor-item">
                <span class="sensor-icon">💧</span>
                <span class="sensor-label">湿度</span>
                <span class="sensor-value" id="sensorHum">--</span>
            </div>
            <div class="sensor-item">
                <span class="sensor-icon">📅</span>
                <span class="sensor-label">今日访客</span>
                <span class="sensor-value" id="sensorToday">--</span>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-card">
                <h3>每日访客</h3>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>访客排行</h3>
                <canvas id="topChart"></canvas>
            </div>
        </div>

        <div class="table-card">
            <h3>访客记录 <span class="badge" id="liveBadge" style="display:none;background:#34c759;color:#fff">新</span></h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>照片</th>
                            <th>时间</th>
                            <th>姓名</th>
                            <th>事由</th>
                            <th>🌡 温度</th>
                            <th>💧 湿度</th>
                            <th>电话</th>
                        </tr>
                    </thead>
                    <tbody id="visitorBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    let dailyChart = null, topChart = null;
    let lastId = 0;

    function showPhoto(src) {
        var l = document.createElement('div');
        l.className = 'photo-lightbox';
        l.onclick = function(){ l.remove(); };
        var i = document.createElement('img');
        i.src = src;
        l.appendChild(i);
        document.body.appendChild(l);
    }

    function rowHtml(v) {
        var photo = '<span class="photo-empty">-</span>';
        if (v.photo) photo = '<img src="' + v.photo + '" class="photo-thumb" onclick="showPhoto(this.src)">';
        else if (v.reason === '摄像头识别') photo = '<span style="font-size:20px">📷</span>';
        var temp = v.temperature ? v.temperature.toFixed(1) + '°C' : '-';
        var hum = v.humidity ? v.humidity.toFixed(1) + '%' : '-';
        return '<tr class="new-row">'
            + '<td>' + photo + '</td>'
            + '<td>' + v.created_at + '</td>'
            + '<td>' + v.name + '</td>'
            + '<td>' + (v.reason || '-') + '</td>'
            + '<td class="col-temp">' + temp + '</td>'
            + '<td class="col-hum">' + hum + '</td>'
            + '<td>' + (v.phone || '-') + '</td>'
            + '</tr>';
    }

    function updateSensorCard(data) {
        var card = document.getElementById('sensorCard');
        var latest = null;
        for (var i = 0; i < data.length; i++) {
            if (data[i].temperature || data[i].humidity) {
                latest = data[i];
                break;
            }
        }
        if (latest && (latest.temperature || latest.humidity)) {
            card.style.display = 'flex';
            document.getElementById('sensorTemp').textContent = latest.temperature ? latest.temperature.toFixed(1) + '°C' : '--';
            document.getElementById('sensorHum').textContent = latest.humidity ? latest.humidity.toFixed(1) + '%' : '--';
            var todayCount = data.filter(function(v) { return v.created_at && v.created_at.slice(0,10) === new Date().toISOString().slice(0,10); }).length;
            document.getElementById('sensorToday').textContent = todayCount + ' 条';
        } else {
            card.style.display = 'none';
        }
    }

    async function loadInitial() {
        var r = await fetch('/api/visitor/list');
        var data = await r.json();
        var tbody = document.getElementById('visitorBody');
        tbody.innerHTML = '';
        data.reverse();
        data.forEach(function(v) {
            tbody.innerHTML = rowHtml(v) + tbody.innerHTML;
        });
        if (data.length > 0) lastId = data[data.length - 1].id;
        updateSensorCard(data);
        updateBadges();
        loadCharts();
    }

    async function pollNew() {
        var r = await fetch('/api/visitor/latest?after_id=' + lastId);
        var data = await r.json();
        if (data.length === 0) return;
        var tbody = document.getElementById('visitorBody');
        data.reverse();
        data.forEach(function(v) {
            tbody.innerHTML = rowHtml(v) + tbody.innerHTML;
            if (v.id > lastId) lastId = v.id;
        });
        document.getElementById('liveBadge').style.display = '';
        setTimeout(function() { document.getElementById('liveBadge').style.display = 'none'; }, 3000);
        updateBadges();
        loadCharts();
        updateSensorCard(data);
    }

    async function updateBadges() {
        var r = await fetch('/api/visitor/list');
        var data = await r.json();
        document.getElementById('totalBadge').textContent = '共 ' + data.length + ' 条';
        var today = data.filter(function(v) { return v.created_at && v.created_at.slice(0,10) === new Date().toISOString().slice(0,10); });
        document.getElementById('todayBadge').textContent = '今日 ' + today.length + ' 条';
    }

    async function loadCharts() {
        var r = await fetch('/api/stats');
        var data = await r.json();
        if (dailyChart) dailyChart.destroy();
        if (topChart) topChart.destroy();
        dailyChart = new Chart(document.getElementById('dailyChart'), {
            type: 'bar',
            data: {
                labels: (data.daily || []).reverse().map(function(d) { return d.day.slice(5); }),
                datasets: [{ label: '访客数', data: (data.daily || []).reverse().map(function(d) { return d.count; }), backgroundColor: '#4f8cf7' }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        topChart = new Chart(document.getElementById('topChart'), {
            type: 'doughnut',
            data: {
                labels: (data.top || []).map(function(d) { return d.name; }),
                datasets: [{ data: (data.top || []).map(function(d) { return d.count; }), backgroundColor: ['#4f8cf7','#34c759','#ff9500','#ff3b30','#af52de'] }]
            },
            options: { responsive: true, plugins: { legend: { position: 'right' } } }
        });
    }

    loadInitial();
    setInterval(pollNew, 3000);
    </script>
</body>
</html>
