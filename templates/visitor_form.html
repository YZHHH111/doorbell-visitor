<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客登记</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-visitor">
    <div class="container visitor-container">
        <div class="card">
            <h1>📋 访客登记</h1>
            <p class="subtitle">请填写您的信息</p>
            <form id="visitorForm">
                <div class="form-group">
                    <label for="name">姓名 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                </div>
                <div class="form-group">
                    <label for="reason">来访事由</label>
                    <input type="text" id="reason" name="reason" placeholder="如：拜访朋友、送快递">
                </div>
                <div class="form-group">
                    <label for="phone">电话</label>
                    <input type="tel" id="phone" name="phone" placeholder="选填，方便联系">
                </div>
                <div class="form-group">
                    <label>拍照（选填）</label>
                    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
                        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
                        <div class="photo-placeholder" id="photoPlaceholder">
                            <span class="camera-icon">📷</span>
                            <span class="photo-text">点击拍照或选择照片</span>
                        </div>
                        <img id="photoPreview" class="photo-preview-hidden">
                    </div>
                </div>
                <button type="submit" class="btn-submit">提交登记</button>
            </form>
            <div id="result" class="result-hidden"></div>
        </div>
    </div>
    <script>
        let compressedPhoto = null;

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = function() {
                let w = img.width, h = img.height;
                const max = 800;
                if (w > max || h > max) {
                    if (w > h) { h = h * max / w; w = max; }
                    else { w = w * max / h; h = max; }
                }
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                c.toBlob(function(blob) {
                    compressedPhoto = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
                    document.getElementById('photoPreview').src = URL.createObjectURL(blob);
                    document.getElementById('photoPreview').className = 'photo-preview-visible';
                    document.getElementById('photoPlaceholder').style.display = 'none';
                }, 'image/jpeg', 0.8);
            };
            img.src = URL.createObjectURL(file);
        });

        document.getElementById('visitorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.btn-submit');
            const result = document.getElementById('result');
            const fd = new FormData();
            fd.append('name', form.name.value);
            fd.append('reason', form.reason.value);
            fd.append('phone', form.phone.value);
            if (compressedPhoto) fd.append('photo', compressedPhoto);
            btn.disabled = true;
            btn.textContent = '提交中...';
            try {
                const resp = await fetch('/api/visitor/submit', { method: 'POST', body: fd });
                const data = await resp.json();
                if (resp.ok) {
                    result.className = 'result-success';
                    result.textContent = data.message || '登记成功！';
                    form.reset();
                    document.getElementById('photoPreview').className = 'photo-preview-hidden';
                    document.getElementById('photoPlaceholder').style.display = '';
                    compressedPhoto = null;
                } else {
                    result.className = 'result-error';
                    result.textContent = data.error || '提交失败';
                }
            } catch (err) {
                result.className = 'result-error';
                result.textContent = '网络错误，请重试';
            }
            btn.disabled = false;
            btn.textContent = '提交登记';
        });
    </script>
</body>
</html>
